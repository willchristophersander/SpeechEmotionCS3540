# Fly.io configuration for Speech Emotion Recognition App
# See: https://fly.io/docs/reference/configuration/

app = "speech-emotion-recognition"
primary_region = "iad"  # Change to your preferred region (iad=Washington DC, ord=Chicago, etc.)

[build]
  # Force use of Dockerfile (don't auto-detect Python/Buildpacks)
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  PYTHON_VERSION = "3.10.19"
  NUMBA_DISABLE_JIT = "0"
  PYTHONUNBUFFERED = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  memory_mb = 1024  # 1 GB RAM (minimum recommended)
  cpu_kind = "shared"
  cpus = 1

[processes]
  app = "gunicorn app:app --timeout 120 --workers 1 --threads 2 --bind 0.0.0.0:8080"

